[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msentity-similarity"
version = "1.2.1"
description = "Spectrum similarity and .mssim files (Python binding of msentity-similarity)"
license = "MIT"
requires-python = ">=3.10"
# Keep the Python binding on the same released msentity version as CMake,
# Java, and C#. Update these pins together for each compatibility release.
dependencies = ["msentity==1.2.0", "numpy"]

[project.optional-dependencies]
arrow = ["pyarrow>=14", "pandas"]

[tool.setuptools]
packages = ["msentity_similarity"]

[tool.setuptools.package-data]
# A wheel bundles the C library here.
msentity_similarity = ["lib/*"]
