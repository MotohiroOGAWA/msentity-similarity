name: Publish Pages wheel index

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate pip index from all GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          {
            echo '<!doctype html><html><body>'
            for repo in "$GITHUB_REPOSITORY" MotohiroOGAWA/msentity; do
              gh api --paginate "/repos/$repo/releases?per_page=100" \
                --jq '.[] | .assets[] | select(.name | endswith(".whl")) | [.browser_download_url, .name] | @tsv' |
                while IFS=$'\t' read -r url name; do
                  echo "<a href=\"$url\">$name</a><br>"
                done
            done
            echo '</body></html>'
          } > site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
