name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            triplet: x64-linux
            library: libmsentity_similarity_c.so
            built: build/libmsentity_similarity_c.so
            wheel_tag: manylinux_2_35_x86_64
            cmake_args: ""
          - os: windows-2022
            rid: win-x64
            triplet: x64-windows-static-md
            library: msentity_similarity_c.dll
            built: build/bin/Release/msentity_similarity_c.dll
            wheel_tag: win_amd64
            cmake_args: ""
          - os: macos-14
            rid: osx-arm64
            triplet: arm64-osx-msentity
            library: libmsentity_similarity_c.dylib
            built: build/libmsentity_similarity_c.dylib
            wheel_tag: macosx_14_0_arm64
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_OSX_ARCHITECTURES=arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check tag and dependency versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q 'GIT_TAG v0.1.0' CMakeLists.txt
          grep -q 'msentity==0.1.0' bindings/python/pyproject.toml

      - name: Set up vcpkg
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            root="$(cygpath -m "$RUNNER_TEMP")/vcpkg"
          else
            root="$RUNNER_TEMP/vcpkg"
          fi
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$baseline"
          if [ "$RUNNER_OS" = Windows ]; then "$root/bootstrap-vcpkg.bat" -disableMetrics; else "$root/bootstrap-vcpkg.sh" -disableMetrics; fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Install vcpkg build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake autoconf-archive libtool pkg-config bison flex
      - name: Install vcpkg build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/triplets" \
            -DMSENTITY_STATIC_DEPS=ON -DMSENTITY_SIMILARITY_TEST_BINDINGS=OFF \
            ${{ matrix.cmake_args }}
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install setuptools wheel
          python bindings/python/build_wheel.py \
            --native "${{ matrix.built }}" --platform-tag "${{ matrix.wheel_tag }}" --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.rid }}
          path: dist/*.whl

  publish:
    name: Publish release
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/msentity-similarity/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "msentity-similarity $GITHUB_REF_NAME" --generate-notes
